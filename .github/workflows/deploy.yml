name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes to the gh-pages branch. GitHub serves that branch as the Pages site
# without any API call the workflow token is not allowed to make.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The same checks as pipeline.yml and app.yml, so a broken main never publishes.
      - run: pip install -e "pipeline[dev]"
      - run: pytest pipeline
      - run: python -m mm_pipeline.build --layers layers --data data --out ../app/public/data
        working-directory: pipeline
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit && npx eslint src e2e && npx vitest run
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
