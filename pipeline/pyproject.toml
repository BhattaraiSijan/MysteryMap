[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-pipeline"
version = "0.1.0"
description = "Builds the Mystery Map catalog from layer files and source CSVs"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["mm_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
