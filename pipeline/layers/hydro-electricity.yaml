id: hydro-electricity
name: Hydro electricity
definition: Share of electricity from hydropower
unit: A percentage of electricity generated.
year: "2022"
family: electricity-mix
status: live
explanation: >
  Lesotho, Bhutan, Paraguay, Nepal and Albania draw nearly all their electricity from dams. Flat,
  dry or small countries, including most islands and the Gulf, have none. The pattern follows
  mountains and big rivers more than wealth.
