explanation: >
  France gets more than 60% of its electricity from nuclear plants, and Slovakia, Ukraine, Belgium
  and Hungary more than 40%. Only about 30 countries have any nuclear power, so most of the map
  shows zero. The top groups are concentrated in Europe, North America and East Asia.
