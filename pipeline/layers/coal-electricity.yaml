id: coal-electricity
name: Coal electricity
definition: Share of electricity from coal
unit: A percentage of electricity generated.
year: "2022"
family: electricity-mix
status: live
explanation: >
  Botswana, Mongolia, South Africa and India burn coal for more than 70% of their electricity, and
  Poland, China and Kazakhstan are also high. Countries with big rivers, gas fields or no coal of
  their own have none. The pattern follows where coal is dug up more than how rich a country is.
