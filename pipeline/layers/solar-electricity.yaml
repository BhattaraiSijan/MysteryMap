explanation: >
  Namibia, Palestine, Lebanon and Luxembourg got more than a fifth of their electricity from the
  sun in 2022, often because other supplies are scarce or expensive. Chile, Australia, Spain and
  Greece are also high among larger economies. Many countries still had no solar at all.
