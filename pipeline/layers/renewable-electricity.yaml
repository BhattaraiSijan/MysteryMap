id: renewable-electricity
name: Renewable electricity
definition: Share of electricity from renewable sources
unit: A percentage of electricity generated.
year: "2022"
family: electricity-mix
status: live
explanation: >
  Paraguay, Nepal, Iceland, Ethiopia and the Democratic Republic of the Congo get essentially all
  their electricity from renewables, mostly rivers. Gulf states and many small islands run almost
  entirely on oil and gas. Hydro-rich mountain and tropical countries score high regardless of
  wealth.
